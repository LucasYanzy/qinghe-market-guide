# Standalone production stack: do not merge with the local demo compose.yaml.
services:
  market:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/market.sqlite
      DEMO_MODE: "false"
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: "https://${MARKET_DOMAIN:?Set MARKET_DOMAIN to your public hostname}"
      TRUST_PROXY: "1"
    volumes:
      - production-data:/data
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
  proxy:
    build:
      context: .
      dockerfile: deploy/Proxy.Dockerfile
    image: qinghe-proxy:local
    environment:
      MARKET_DOMAIN: "${MARKET_DOMAIN:?Set MARKET_DOMAIN to your public hostname}"
    command:
      - --api=false
      - --ping=true
      - --providers.file.filename=/etc/traefik/routes.yaml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=30s
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=30s
      - --entrypoints.websecure.transport.respondingtimeouts.idletimeout=60s
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/routes.yaml:/etc/traefik/routes.yaml:ro
      - proxy-data:/data
    networks: [edge, backend]
    depends_on:
      market:
        condition: service_healthy
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
networks:
  edge:
  backend:
    internal: true
volumes:
  production-data:
  proxy-data:

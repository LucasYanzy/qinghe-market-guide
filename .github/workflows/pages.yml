name: Build interactive demo artifact
on:
  push:
    branches: ["feat/public-release-architecture"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-guide-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:public
        env:
          PUBLIC_BASE_PATH: /qinghe-market-guide/
      - uses: actions/upload-artifact@v4
        with:
          name: public-market-guide
          path: dist-public
          include-hidden-files: true
          retention-days: 7

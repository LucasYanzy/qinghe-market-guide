name: Validate application
on:
  push:
    branches: ["feat/public-release-architecture", "feat/farmers-market-platform", "main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 8 * * 1"
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
      - run: npx playwright test --config playwright.public.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            public-test-results/
            playwright-report/
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --pull --tag qinghe:test .
      - name: Scan runtime image with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: qinghe:test
          severity-cutoff: high
          fail-build: true
          only-fixed: false
          output-format: table
      - run: docker build --pull --file deploy/Proxy.Dockerfile --tag qinghe-proxy:local .
      - name: Scan HTTPS proxy image with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: qinghe-proxy:local
          severity-cutoff: high
          fail-build: true
          only-fixed: false
          output-format: table
      - name: Verify production HTTPS routing and redirect
        env:
          MARKET_DOMAIN: market.example.com
          # Never contact a public ACME endpoint for a CI example domain.
          ACME_CA_SERVER: http://127.0.0.1:9/directory
        run: |
          docker compose -f compose.production.yaml config --quiet
          docker compose -f compose.production.yaml up --build --wait --wait-timeout 120
          curl --fail --insecure --resolve market.example.com:443:127.0.0.1 https://market.example.com/api/health
          case "$(curl --silent --output /dev/null --write-out '%{http_code}' --resolve market.example.com:80:127.0.0.1 http://market.example.com/)" in
            301|308) ;;
            *) exit 1 ;;
          esac
          docker compose -f compose.production.yaml down
      - name: Verify container with durable storage
        run: |
          docker volume create qinghe-test
          docker run --detach --name qinghe --publish 127.0.0.1:3001:3001 --env PUBLIC_ORIGIN=https://market.example.com --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 512m --mount source=qinghe-test,target=/data qinghe:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3001/api/health
          curl --fail http://127.0.0.1:3001/admin/operations
          docker restart qinghe
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:3001/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3001/api/health
      - run: if docker container inspect qinghe >/dev/null 2>&1; then docker logs qinghe; fi
        if: failure()
